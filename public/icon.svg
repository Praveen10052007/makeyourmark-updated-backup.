<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="mMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle inner shadow border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Iconic 'M' with dynamic launch mark -->
  <g transform="translate(64, 76)">
    <!-- Main Left Stem -->
    <path d="M 40 310 L 40 90 Q 40 70 60 70 Q 75 70 85 85 L 192 240 L 299 85 Q 309 70 324 70 Q 344 70 344 90 L 344 310 Q 344 326 328 326 Q 312 326 312 310 L 312 136 L 210 286 Q 200 300 184 300 Q 168 300 158 286 L 72 136 L 72 310 Q 72 326 56 326 Q 40 326 40 310 Z" 
          fill="url(#mMark)" filter="url(#glow)" />
          
    <!-- Dynamic Checkmark / Rocket Star spark -->
    <circle cx="192" cy="110" r="16" fill="#38bdf8" />
    <path d="M 192 60 L 199 95 L 234 102 L 199 109 L 192 144 L 185 109 L 150 102 L 185 95 Z" fill="#ffffff" />
  </g>
</svg>
